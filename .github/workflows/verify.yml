name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/verify.sh
      - run: uv run --frozen --group dev python -m pytest -q tests/test_init_owner_cli.py tests/test_tls_presets.py tests/test_acme.py tests/test_migration_lineage.py tests/test_migration_reconciliation.py tests/test_xray_loopback_migration.py tests/test_host_balancers.py tests/test_subscription_firewall.py tests/test_device_webhook_receiver_integration.py
