name: Publish independently replaceable WayLane Node
on:
  push:
    tags:
      - 'node-v*'
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/node/go.mod
      - working-directory: services/node
        run: ./scripts/verify.sh
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: services/node/node.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kobaproduction/waylane-node:${{ github.ref_name }}
      - name: Record the only permitted release reference
        env:
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Immutable Node image for operator approval:" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/kobaproduction/waylane-node@${RELEASE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "No Agent redeploy or Node installation was triggered by this image release." >> "$GITHUB_STEP_SUMMARY"
