name: Node
on:
  push:
    branches: [main, development, migration/waylane-monorepo]
    paths:
      - "services/node/**"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "services/node/**"
      - ".github/workflows/node.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/node/go.mod
      - run: ./scripts/verify.sh
  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/node
          file: ./services/node/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-node:ci
  agent-images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/node/agent/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-agent:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/node/bootstrap/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-bootstrap:ci

  agent-compose-smoke:
    needs: agent-images
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WAYLANE_PANEL_URL: https://panel.example.invalid
      WAYLANE_DISCOVERY_TOKEN: wl_disc_ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap and rootless engine readiness
        run: |
          set -euo pipefail
          docker compose -f services/node/docker-compose.agent.yaml up -d --build rootless-engine
          docker compose -f services/node/docker-compose.agent.yaml ps -a
          for n in $(seq 1 25); do
            if docker compose -f services/node/docker-compose.agent.yaml exec -T rootless-engine               docker -H unix:///run/user/1000/docker.sock info --format '{{json .SecurityOptions}}' 2>/dev/null | grep -q rootless; then
              echo 'Rootless Docker is operational'; exit 0
            fi
            sleep 2
          done
          docker compose -f services/node/docker-compose.agent.yaml logs --no-color --tail=80
          exit 1
      - name: Remove disposable test engine
        if: always()
        run: docker compose -f services/node/docker-compose.agent.yaml down -v --remove-orphans
