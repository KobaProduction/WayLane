name: Node
on:
  push:
    branches: [main, development, migration/waylane-monorepo]
    paths:
      - "services/node/**"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "services/node/**"
      - ".github/workflows/node.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/node/go.mod
      - run: ./scripts/verify.sh
  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/node
          file: ./services/node/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-node:ci
  agent-images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/node/agent/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-agent:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/node/bootstrap/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-bootstrap:ci
