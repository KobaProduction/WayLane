name: Backend
on:
  push:
    branches: [main, development, migration/waylane-monorepo]
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/verify.sh
      - name: Run original regression suite plus direct OTLP acceptance
        run: >-
          uv run --frozen --group dev python -m pytest -q
          tests/test_init_owner_cli.py
          tests/test_tls_presets.py
          tests/test_acme.py
          tests/test_migration_lineage.py
          tests/test_migration_reconciliation.py
          tests/test_xray_loopback_migration.py
          tests/test_host_balancers.py
          tests/test_core_presets.py
          tests/test_business_analytics_readonly.py
          tests/test_subscription_firewall.py
          tests/test_device_webhook_receiver_integration.py
          tests/test_device_webhook_auto_retry.py
          tests/test_dashboard_api_only.py
          tests/test_direct_otlp.py
  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          push: false
          platforms: linux/amd64
          tags: waylane-backend:ci
