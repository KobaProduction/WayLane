name: Release one WayLane service
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.component.outputs.component }}
    steps:
      - id: component
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            backend-v*) echo "component=backend" >> "$GITHUB_OUTPUT";;
            frontend-v*) echo "component=frontend" >> "$GITHUB_OUTPUT";;
            node-v*) echo "component=node" >> "$GITHUB_OUTPUT";;
            *) echo "Unsupported component release tag" >&2; exit 1;;
          esac
  verify:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.component == 'frontend'
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@v6
        if: needs.detect.outputs.component == 'backend'
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        if: needs.detect.outputs.component == 'backend'
      - uses: actions/setup-go@v5
        if: needs.detect.outputs.component == 'node'
        with:
          go-version-file: services/node/go.mod
      - name: Component verification
        env:
          COMPONENT: ${{ needs.detect.outputs.component }}
        run: cd "services/$COMPONENT" && ./scripts/verify.sh
  publish:
    needs: [detect, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ needs.detect.outputs.component }}
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ needs.detect.outputs.component }}
          file: ./services/${{ needs.detect.outputs.component }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
