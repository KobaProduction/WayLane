# Base Directory /services/backend; Compose Location /docker-compose.coolify.yaml.
# Use Connect To Predefined Network to resolve waylane-postgres and waylane-api.
services:
  waylane-api:
    extends:
      file: docker-compose.yaml
      service: waylane-api
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-waylane}
      POSTGRES_HOST: waylane-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_MIGRATION_HOST: waylane-postgres
      POSTGRES_AUTO_CREATE_DB: "false"
      WAYLANE_NODE_EXTRA_IMAGE_REPOSITORY: ${WAYLANE_NODE_EXTRA_IMAGE_REPOSITORY:-}
      WAYLANE_TLS_SECRET_KEY: ${WAYLANE_TLS_SECRET_KEY:?}
      WAYLANE_DEVICE_WEBHOOK_SECRET: ${WAYLANE_DEVICE_WEBHOOK_SECRET:?}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:?}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:?}
volumes:
  backend-data: {}
