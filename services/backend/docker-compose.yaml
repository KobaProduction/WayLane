# Independently deployed WayLane API using separately managed PostgreSQL.
# Provide the same PostgreSQL credential reference to the dependency and API.
# The API NEVER owns a database container or its persistent volume.
services:
  waylane-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/code/.venv/bin/python", "/code/compose_db_entrypoint.py"]
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-waylane}
      POSTGRES_HOST: waylane-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_MIGRATION_HOST: waylane-postgres
      POSTGRES_AUTO_CREATE_DB: "false"
      WAYLANE_TLS_SECRET_KEY: ${WAYLANE_TLS_SECRET_KEY:?}
      WAYLANE_DEVICE_WEBHOOK_SECRET: ${WAYLANE_DEVICE_WEBHOOK_SECRET:?}
      ROLE: all-in-one
      NATS_ENABLED: "0"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      UVICORN_WORKERS: "1"
      OTLP_ENDPOINT: ${OTEL_ENDPOINT:?}
      OTLP_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:?}
      OTEL_NAMESPACE: WayLane
      OTEL_SERVICE_NAME: backend
      DEPLOYMENT_ENVIRONMENT: development
    expose:
      - "8000"
    volumes:
      - backend-data:/var/lib/pasarguard
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  backend-data: {}
