# WayLane Node — classic registration. One installation = bootstrap + agent + private cores.
# Runtime services retain internal process names; the product entity is a Node.
services:
  bootstrap:
    extends:
      file: ./docker-compose.node.yaml
      service: bootstrap
  agent:
    extends:
      file: ./docker-compose.node.yaml
      service: agent
    environment:
      CONTROL_PANEL_URL: ${CONTROL_PANEL_URL:?}
      NODE_TOKEN: ${NODE_TOKEN:?}
      DISCOVERY_TOKEN: ""
      NODE_NAME: ${NODE_NAME:-}
      CONTROL_TRANSPORT: ${CONTROL_TRANSPORT:-grpc}
      DEV_ALLOW_HTTP: "false"
      GRPC_DEV_INSECURE: "false"
volumes:
  agent-state: {}
  rootless-data: {}
  rootless-run: {}
