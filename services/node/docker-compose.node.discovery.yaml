# WayLane Node — discovery registration. One installation = bootstrap + agent + private cores.
# Runtime services retain internal process names; the product entity is a Node.
services:
  bootstrap:
    extends:
      file: ./docker-compose.node.yaml
      service: bootstrap
  agent:
    extends:
      file: ./docker-compose.node.yaml
      service: agent
    environment:
      CONTROL_PANEL_URL: ${CONTROL_PANEL_URL:?}
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?}
      NODE_TOKEN: ""
      DEV_ALLOW_HTTP: "false"
volumes:
  agent-state: {}
  rootless-data: {}
  rootless-run: {}
