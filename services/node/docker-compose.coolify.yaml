# Coolify Base Directory /services/node; Compose Location /docker-compose.coolify.yaml
# Persist Watch Paths services/node/**; node host network is independent of frontend/backend.
x-watch-path-coolify:
  - "services/node/**"
services:
  node:
    extends:
      file: docker-compose.yaml
      service: node
    environment:
      API_KEY: ${API_KEY:?}
