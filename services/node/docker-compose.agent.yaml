# Opt-in Compose-owned rootless runtime. Legacy node unaffected.
name: waylane-agent
services:
  bootstrap:
    build:
      context: ../..
      dockerfile: services/node/bootstrap/Dockerfile
    restart: "no"
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - rootless-data:/bootstrap/docker-data
      - rootless-run:/bootstrap/docker-run
      - agent-state:/bootstrap/agent-state

  docker:
    image: docker:29.5-dind-rootless
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      DOCKER_TLS_CERTDIR: ""
      XDG_RUNTIME_DIR: /run/user/1000
    command:
      - dockerd
      - --host=unix:///run/user/1000/docker.sock
      - --iptables=false
      - --ip6tables=false
      - --bridge=none
      - --tls=false
    volumes:
      - rootless-data:/home/rootless/.local/share/docker
      - rootless-run:/run/user/1000
    healthcheck:
      test: ["CMD-SHELL", "docker --host unix:///run/user/1000/docker.sock info --format '{{json .SecurityOptions}}' 2>/dev/null | grep -q rootless"]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 12
    pids_limit: 512

  agent:
    build:
      context: ../..
      dockerfile: services/node/agent/Dockerfile
    depends_on:
      docker:
        condition: service_healthy
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WAYLANE_PANEL_URL: ${WAYLANE_PANEL_URL:?HTTPS panel URL required}
      WAYLANE_DISCOVERY_TOKEN: ${WAYLANE_DISCOVERY_TOKEN:?discovery token required}
      WAYLANE_AGENT_NAME: ${WAYLANE_AGENT_NAME:-waylane-node}
      WAYLANE_AGENT_STATE_DIR: /var/lib/waylane-agent
      WAYLANE_ROOTLESS_SOCKET: /run/waylane/docker.sock
    volumes:
      - agent-state:/var/lib/waylane-agent
      - rootless-run:/run/waylane
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    pids_limit: 64
volumes:
  rootless-data: {}
  rootless-run: {}
  agent-state: {}
