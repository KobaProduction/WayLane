# Coolify: Source KobaProduction/WayLane main; Base Directory /services/node
# Compose Location /docker-compose.node.discovery.coolify.yaml
# Watch Paths services/node/** (save in Coolify; x-* does not configure it).
x-watch-path-coolify:
  - "services/node/**"
services:
  bootstrap:
    extends:
      file: ./docker-compose.node.yaml
      service: bootstrap
    network_mode: none
    exclude_from_hc: true
  agent:
    extends:
      file: ./docker-compose.node.yaml
      service: agent
    environment:
      CONTROL_PANEL_URL: ${CONTROL_PANEL_URL:?}
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?}
      NODE_TOKEN: ""
      DEV_ALLOW_HTTP: "false"
volumes:
  agent-state: {}
  rootless-data: {}
  rootless-run: {}
