# Standalone VPN node. Never bundle into WayLane Control Plane.
# Host WireGuard kernel support and TLS credentials must be prepared separately.
name: waylane-node
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      API_KEY: ${API_KEY:?}
      SERVICE_PORT: "62050"
      SERVICE_PROTOCOL: grpc
      PG_NODE_WG_HOST_ROUTING: "1"
      SSL_CERT_FILE: /var/lib/pg-node/certs/ssl_cert.pem
      SSL_KEY_FILE: /var/lib/pg-node/certs/ssl_key.pem
      GENERATED_CONFIG_PATH: /var/lib/pg-node/generated
    volumes:
      - /var/lib/pg-node:/var/lib/pg-node
