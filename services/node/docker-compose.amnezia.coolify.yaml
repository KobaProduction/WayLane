# Alternative Coolify entrypoint for Linux AWG-enabled nodes ONLY.
# Base Directory /services/node; Compose Location /docker-compose.amnezia.coolify.yaml.
# Do not use for legacy kernel-only WireGuard nodes lacking /dev/net/tun.
x-watch-path-coolify:
  - "services/node/**"
services:
  node:
    extends:
      file: docker-compose.yaml
      service: node
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      API_KEY: \${API_KEY:?}
