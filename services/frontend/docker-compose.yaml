# Independently deployable WayLane SPA. Its API upstream is a separate
# private-network service, not a sidecar or a host-published backend port.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_API: ${VITE_BASE_API:-/}
        NGINX_CONFIG: deploy/nginx.bundled.conf
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
