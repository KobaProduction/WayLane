# Standalone UI image. External ingress owns API routing to the independent
# backend service and TLS; this resource does not become the API balancer.
name: waylane-frontend
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_API: ${VITE_BASE_API:-/}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
