# Bundled topology only: same-origin frontend + authenticated backend.
# Browser diagnostics are POSTed to the Backend, which owns OTLP export.
# Do not treat Nginx access logs as application telemetry.
access_log off;
error_log /dev/stderr warn;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Resolve the private API on each request, not once at nginx startup.
    # Coolify replaces backend containers independently and may change their IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $waylane_api_upstream waylane-api:8000;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    # Binary Protobuf Agent control requires a real WebSocket upgrade.
    # Keep the Node UUID/query out of the access log.
    location = /api/node-control/control/ws {
        access_log off;
        proxy_pass http://$waylane_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://$waylane_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /sub/ {
        # Subscription URLs contain bearer-style tokens in the path.
        # Never write them to Nginx access logs.
        access_log off;
        proxy_pass http://$waylane_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location /statics/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
