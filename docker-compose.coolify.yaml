# Coolify: Base Directory / ; Docker compose location /docker-compose.coolify.yaml
# Operator contract: WAYLANE_POSTGRES_USERNAME (default waylane),
# WAYLANE_POSTGRES_PASSWORD (required, no default), and
# WAYLANE_POSTGRES_DATABASE (optional, default waylane).
# Coolify Required/Buildtime flags and secret scope require parser acceptance.
x-watch-path-coolify:
  - "docker-compose.yaml"
  - "docker-compose.coolify.yaml"
  - "deploy/compose/all-in-one/**"
  - "services/backend/**"
  - "services/frontend/**"

services:
  postgres:
    extends:
      file: docker-compose.yaml
      service: postgres
    environment:
      POSTGRES_USER: ${WAYLANE_POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${WAYLANE_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${WAYLANE_POSTGRES_DATABASE:-waylane}
  backend:
    extends:
      file: docker-compose.yaml
      service: backend
    environment:
      POSTGRES_USER: ${WAYLANE_POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${WAYLANE_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${WAYLANE_POSTGRES_DATABASE:-waylane}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTLP_BEARER_TOKEN:-}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-waylane}
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: ${OTEL_DEPLOYMENT_ENVIRONMENT_NAME:-development}
  frontend:
    extends:
      file: docker-compose.yaml
      service: frontend
    environment:
      # Coolify-managed public route; no new operator-supplied ENV.
      SERVICE_FQDN_FRONTEND_8080: /

# Compose extends merges services but does NOT import top-level declarations.
networks:
  application: {}
  database:
    internal: true
volumes:
  postgres_data: {}
  backend_data: {}
