# Coolify: Base Directory / ; Docker compose location /docker-compose.coolify.yaml
# Operator contract: POSTGRES_USERNAME (default waylane),
# POSTGRES_PASSWORD (required, no default), and
# POSTGRES_DATABASE (optional, default waylane).
# Coolify Required/Buildtime flags and secret scope require parser acceptance.
x-watch-path-coolify:
  - "docker-compose.yaml"
  - "docker-compose.coolify.yaml"
  - "deploy/compose/**"
  - "services/backend/**"
  - "services/frontend/**"

services:
  postgres:
    extends:
      file: docker-compose.yaml
      service: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
  pgbouncer:
    extends:
      file: docker-compose.yaml
      service: pgbouncer
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
  backend:
    extends:
      file: docker-compose.yaml
      service: backend
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
      OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      OTEL_SERVICE_NAMESPACE: ${OTEL_NAMESPACE:-waylane}
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: ${DEPLOYMENT_ENVIRONMENT:-development}
  # Unlike local Compose, a Git-owned Coolify resource must not inherit the
  # host-loopback port or repository-file bind mount from the local frontend.
  # Bake the bundled reverse proxy into the frontend image instead.
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_API: /
        NGINX_CONFIG: deploy/nginx.bundled.conf
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - application
    environment:
      SERVICE_URL_FRONTEND_8080: /
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

# Compose extends merges services but does NOT import top-level declarations.
networks:
  application: {}
  database:
    internal: true
volumes:
  postgres_data: {}
  backend_data: {}
