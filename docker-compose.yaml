# All-in-one CONTROL PLANE: PostgreSQL + backend + frontend.
# Nodes are deployed separately; NET_ADMIN is currently required for their networking.
# Start: docker compose up -d --build with untracked .env credentials.
name: waylane
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgbouncer:
    build:
      context: ./deploy/compose/pgbouncer
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
    networks:
      database:
        aliases: [database]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; c=socket.socket(); c.settimeout(2); assert c.connect_ex(('127.0.0.1', 5432)) == 0; c.close()"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/code/.venv/bin/python", "/code/compose_db_entrypoint.py"]
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_MIGRATION_HOST: postgres
      ROLE: all-in-one
      UVICORN_HOST: waylane-api
      UVICORN_PORT: "8000"
      UVICORN_WORKERS: "1"
      OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTLP_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
      OTEL_SERVICE_NAMESPACE: ${OTEL_NAMESPACE:-waylane}
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: ${DEPLOYMENT_ENVIRONMENT:-development}
    volumes:
      - backend_data:/var/lib/pasarguard
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      database: {}
      application:
        aliases: [waylane-api]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://waylane-api:8000/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_API: /
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/compose/all-in-one/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  application: {}
  database:
    internal: true
volumes:
  postgres_data: {}
  backend_data: {}
