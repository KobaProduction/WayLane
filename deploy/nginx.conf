# Standalone SPA: the API and ingress are independently deployed.
log_format waylane_json escape=json
  '{"timestamp":"$time_iso8601","level":"info",'
  '"service.name":"waylane-frontend","event":"http.access",'
  '"request_id":"$request_id","method":"$request_method",'
  '"path":"$uri","status":$status,"duration_s":$request_time,'
  '"bytes_sent":$body_bytes_sent}';
access_log /dev/stdout waylane_json;
error_log /dev/stderr warn;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /statics/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        # React hash router uses #/dashboard; URLs need SPA fallback.
        try_files $uri $uri/ /index.html;
    }
}
