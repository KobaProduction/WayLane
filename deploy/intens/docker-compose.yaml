# WayLane backend exports sanitized OTLP/HTTP telemetry only to the private collector.
services:
  db-init:
    image: postgres:16-alpine
    restart: 'no'
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: waylane
      PGDATABASE: postgres
      PGPASSWORD: ${WAYLANE_POSTGRES_PASSWORD:?}
    command:
    - /bin/sh
    - -ec
    - |
      psql -X -v ON_ERROR_STOP=1 <<'SQL'
      SELECT format('CREATE DATABASE %I OWNER %I', 'waylane', current_user)
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'waylane') \gexec
      SQL
    networks:
    - dependencies
  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    image: ${WAYLANE_BACKEND_IMAGE:-waylane-backend:dev}
    pull_policy: ${WAYLANE_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    entrypoint:
    - /code/.venv/bin/python
    - /code/compose_db_entrypoint.py
    environment:
      POSTGRES_USER: waylane
      POSTGRES_PASSWORD: ${WAYLANE_POSTGRES_PASSWORD:?}
      POSTGRES_DB: waylane
      POSTGRES_HOST: database
      ROLE: all-in-one
      UVICORN_HOST: waylane-api
      UVICORN_PORT: '8000'
      UVICORN_WORKERS: ${WAYLANE_WORKERS:-1}
      OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAMESPACE: waylane
      OTEL_DEPLOYMENT_ENVIRONMENT_NAME: ${DEPLOYMENT_ENVIRONMENT:?}
    volumes:
    - waylane-data:/var/lib/pasarguard
    networks:
      dependencies:
        aliases:
        - waylane-api
      egress: {}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://waylane-api:8000/health >/dev/null
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_API: /
        NGINX_CONFIG: deploy/nginx.intens.conf
    image: ${WAYLANE_FRONTEND_IMAGE:-waylane-frontend:dev}
    pull_policy: ${WAYLANE_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
    - '8080'
    networks:
    - dependencies
    - egress
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/health
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  waylane-data:
    driver: local
networks:
  dependencies:
    name: intens-vpn-${DEPLOYMENT_ENVIRONMENT:?}
    external: true
  egress:
    driver: bridge
