# Base Directory /deploy/dependencies; Compose Location /docker-compose.coolify.yaml.
# Intended Watch Paths: deploy/dependencies/**. This x-* key is documentation
# only; Public Git sources may require manual-only deployment.
x-watch-path-coolify:
  - "deploy/dependencies/**"
services:
  waylane-postgres:
    extends:
      file: docker-compose.yaml
      service: waylane-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
volumes:
  postgres-data: {}
