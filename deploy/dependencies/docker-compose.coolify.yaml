# Base Directory /deploy/dependencies; Compose Location /docker-compose.coolify.yaml.
# Set Watch Paths to deploy/dependencies/** ONLY in the Coolify resource UI.
x-watch-path-coolify:
  - "deploy/dependencies/**"
services:
  waylane-postgres:
    extends:
      file: docker-compose.yaml
      service: waylane-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-waylane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-waylane}
volumes:
  postgres-data: {}
