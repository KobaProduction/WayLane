# WayLane Node Discovery — Coolify Git-backed adapter.
# Save Watch Paths in Coolify; YAML does not configure Coolify webhook filters.
services:
  bootstrap:
    extends:
      file: ./docker-compose.yaml
      service: bootstrap
    exclude_from_hc: true
  agent:
    extends:
      file: ./docker-compose.yaml
      service: agent
    environment:
      CONTROL_PANEL_URL: ${CONTROL_PANEL_URL:?}
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?}
      NODE_TOKEN: ""
      DEV_ALLOW_HTTP: "false"
      AWG_EXPERIMENTAL_DEV: "false"

# A Coolify resource owns its own volumes/Compose project identity.
volumes:
  agent-state: {}
  rootless-data: {}
  rootless-run: {}
