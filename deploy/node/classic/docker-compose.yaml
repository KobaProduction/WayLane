# WayLane Node Classic — standalone Docker Compose entrypoint.
# WayLane Node: bootstrap + internal controller agent, with private VPN cores.
# Bootstrap prepares private volumes; Go Agent supervises embedded rootless Docker.
# This profile grants nested namespace exceptions; production security and VPN traffic are NOT accepted.
services:
  bootstrap:
    build:
      context: ../../..
      dockerfile: services/agent/bootstrap.Dockerfile
    user: "0:0"
    privileged: true
    restart: "no"
    network_mode: none
    read_only: true
    volumes:
      - agent-state:/bootstrap/agent-state
      - rootless-data:/bootstrap/docker-data
      - rootless-run:/bootstrap/docker-run
  agent:
    build:
      context: ../../..
      dockerfile: services/agent/agent.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    # The stable Agent shares the Linux host network namespace.
    # Node and VPN Cores use host networking in the rootless engine.
    # No static ports list: applications bind/unbind TCP/UDP dynamically.
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      HOME: /home/rootless
      XDG_RUNTIME_DIR: /run/user/1000
      DOCKER_TLS_CERTDIR: ""
      CONTROL_PANEL_URL: ${CONTROL_PANEL_URL:?}
      # Registration credential is mode-scoped; protect it in the runtime.
      # Keep agent-state persistent to retain identity between restarts.
      DISCOVERY_TOKEN: ""
      NODE_TOKEN: ${NODE_TOKEN:?}
      DEV_ALLOW_HTTP: ${DEV_ALLOW_HTTP:-false}
      # Strict loopback-only development gate; never enabled for Coolify.
      AWG_EXPERIMENTAL_DEV: ${AWG_EXPERIMENTAL_DEV:-false}
      # One authenticated WebSocket, binary Protobuf frames only.
      NODE_STATE_DIR: /var/lib/waylane-agent
      ROOTLESS_SOCKET: /run/user/1000/docker.sock
    volumes:
      - agent-state:/var/lib/waylane-agent
      - rootless-data:/home/rootless/.local/share/docker
      - rootless-run:/run/user/1000
      # Read host-machine identity, not the container hostname; no host Docker socket.
      - type: bind
        source: /etc/hostname
        target: /etc/waylane/host-hostname
        read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/waylane-agent/control/agent.sock && docker -H unix:///run/user/1000/docker.sock info --format '{{json .SecurityOptions}}' 2>/dev/null | grep -q rootless && docker -H unix:///run/user/1000/docker.sock container inspect --format '{{.State.Running}} {{index .Config.Labels \"waylane.component\"}}' waylane-node-runtime 2>/dev/null | grep -qx 'true node'"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5
volumes:
  agent-state: {}
  rootless-data: {}
  rootless-run: {}
